name: Refresh managed ix SDK lock

on:
  push:
    branches: [feat/managed-sandbox-escalation]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: feat/managed-sandbox-escalation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
      - name: Refresh only the managed npm lock
        run: npm install --prefix services/managed --package-lock-only --ignore-scripts
      - name: Commit lock and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-ix-sdk-lock.yml
          git add services/managed/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(managed): lock ix SDK"
          git push
