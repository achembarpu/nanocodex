name: CI

permissions: {}

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test Rust 1.97
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --locked

  quality:
    name: rustfmt, clippy, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - name: Clippy workspace targets
        run: |
          cargo clippy --workspace --all-targets --all-features --exclude nanocodex-bin -- -D warnings -A clippy::missing_const_for_fn
          cargo clippy --package nanocodex-bin --all-features --bin nanocodex -- -D warnings -A clippy::missing_const_for_fn
          cargo clippy --package nanocodex-bin --all-features --bench tui_render -- -D warnings -A clippy::missing_const_for_fn
      - name: Check independently usable crates and public examples
        run: |
          cargo check --locked --package nanocodex-oai-api
          cargo check --locked --package nanocodex-observability
          cargo check --locked --package nanocodex-tools
          cargo check --locked --package nanocodex-agent
          cargo check --locked --package nanocodex-examples --bins
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  vm-guest:
    name: static Linux VM guest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Check the guest-only target matrix
        run: >-
          cargo check --locked --package nanocodex-vm --all-targets
          --no-default-features --features guest-runtime
      - name: Build the actual static guest artifact
        run: >-
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo build --locked --package nanocodex-vm
          --bin nanocodex-vm-guest --no-default-features
          --features guest-runtime --target x86_64-unknown-linux-musl

  policy:
    name: dependencies and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: cargo-deny
      - run: ./scripts/check-experimental-boundary.sh
      - run: cargo deny check
      - run: ./scripts/check-crate-boundaries.sh
      - run: ./scripts/check-rustls-provider.sh
      - uses: crate-ci/typos@96d9af6217dc2855210655af7e1ff19d23d4e593 # v1

  bindings:
    name: Node and browser bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nanocodex_test
          POSTGRES_PASSWORD: nanocodex_test
          POSTGRES_USER: nanocodex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nanocodex_test -d nanocodex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nanocodex_test:nanocodex_test@127.0.0.1:5432/nanocodex_test
      NANOCODEX_LIVE_POSTGRES: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: |
            js/nanocodex/package-lock.json
            js/nanocodex-react/package-lock.json
            js/nanocodex-vite/package-lock.json
            js/nanocodex-terminal/package-lock.json
            examples/node/package-lock.json
            js/egress/package-lock.json
            js/managed/package-lock.json
            examples/vercel-workflows/package-lock.json
            examples/react-vite/package-lock.json
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Build WASM consumers
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown \
            --package nanocodex-oai-api \
            --package nanocodex-tools \
            --package nanocodex-agent \
            --package nanocodex \
            --package nanocodex-wasm \
            -- -D warnings -A clippy::missing_const_for_fn
          npm ci --prefix js/nanocodex
          npm ci --prefix js/nanocodex-react
          npm ci --prefix js/nanocodex-vite
          npm ci --prefix js/nanocodex-terminal
          ./js/nanocodex-vite/scripts/build-js-package.sh
          npm ci --prefix examples/node
          npm ci --prefix js/egress
          npm ci --prefix js/managed
          npm ci --prefix examples/vercel-workflows
          npm ci --prefix examples/react-vite
      - name: Test JS runtime
        working-directory: js/nanocodex
        run: |
          node --test --test-timeout=15000 test/*.test.mjs
          npm run test:performance
      - name: Check JS consumers
        run: |
          npm run test:typecheck --prefix js/nanocodex
          npm run check:package --prefix js/nanocodex
          npm test --prefix js/nanocodex-react
          npm test --prefix js/nanocodex-vite
          npm test --prefix js/nanocodex-terminal
          node --test examples/browser-cdn/*.test.mjs
          npm test --prefix examples/node
          npm run typecheck --prefix js/egress
          npm test --prefix js/egress
          npm run dry-run:broker --prefix js/egress
          npm run typecheck --prefix js/managed
          npm test --prefix js/managed
          npm run build --prefix js/managed
          npm run check --prefix examples/vercel-workflows
          npm test --prefix examples/react-vite
          npm run build --prefix examples/react-vite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nanocodex-web-wasm
          path: js/nanocodex/pkg-web
          if-no-files-found: error

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: py/bindings/pyproject.toml
      - name: Build Python wheel
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "maturin>=1.9,<2" \
            "mypy==2.3.0"
          maturin build \
            --locked \
            --manifest-path py/bindings/Cargo.toml \
            --interpreter python \
            --out dist/python \
            --release
          python py/bindings/benchmarks/check_package_size.py \
            dist/python/*.whl
      - name: Test installed Python package
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/nanocodex-python"
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m pip install \
            --disable-pip-version-check \
            dist/python/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/py/bindings/tests" \
            -v
          "$RUNNER_TEMP/nanocodex-python/bin/python" \
            "$GITHUB_WORKSPACE/py/bindings/tests/typing_consumer.py"
          python -m mypy \
            --strict \
            --python-executable "$RUNNER_TEMP/nanocodex-python/bin/python" \
            "$GITHUB_WORKSPACE/py/bindings/tests/typing_consumer.py"
          "$RUNNER_TEMP/nanocodex-python/bin/python" \
            "$GITHUB_WORKSPACE/py/bindings/benchmarks/benchmark_binding.py" \
            --check
          "$RUNNER_TEMP/nanocodex-python/bin/python" -m compileall \
            -q "$GITHUB_WORKSPACE/examples/python"

  apps:
    name: JavaScript apps
    needs: bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: |
            js/nanocodex/package-lock.json
            js/nanocodex-react/package-lock.json
            js/nanocodex-vite/package-lock.json
            js/nanocodex-terminal/package-lock.json
            js/account/package-lock.json
            js/connect-dialog/package-lock.json
            js/connect-playground/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nanocodex-web-wasm
          path: js/nanocodex/pkg-web
      - name: Build local website packages
        run: |
          npm ci --prefix js/nanocodex
          npm ci --prefix js/nanocodex-react
          npm ci --prefix js/nanocodex-vite
          npm ci --prefix js/nanocodex-terminal
          npm run build --prefix js/nanocodex-terminal
          npm ci --prefix js/account
          npm ci --prefix js/connect-dialog
          npm ci --prefix js/connect-playground
      - name: Type-check and build the account app
        working-directory: js/account
        run: npm run test:web && npm run build
      - name: Type-check and build the Connect dialog
        run: npm run build --prefix js/connect-dialog
      - name: Type-check and build the Connect playground
        run: npm run build --prefix js/connect-playground
  codeql:
    name: CodeQL actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          category: /language:actions

  ci-success:
    name: ci success
    if: always()
    needs: [test, quality, vm-guest, policy, bindings, python, apps, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          TEST: ${{ needs.test.result }}
          QUALITY: ${{ needs.quality.result }}
          VM_GUEST: ${{ needs.vm-guest.result }}
          POLICY: ${{ needs.policy.result }}
          BINDINGS: ${{ needs.bindings.result }}
          PYTHON: ${{ needs.python.result }}
          APPS: ${{ needs.apps.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          test "$TEST" = success
          test "$QUALITY" = success
          test "$VM_GUEST" = success
          test "$POLICY" = success
          test "$BINDINGS" = success
          test "$PYTHON" = success
          test "$APPS" = success
          test "$CODEQL" = success
