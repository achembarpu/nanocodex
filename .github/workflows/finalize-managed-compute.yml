name: Finalize managed compute binding

on:
  push:
    branches: [feat/managed-sandbox-escalation]
    paths: [.github/workflows/finalize-managed-compute.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: feat/managed-sandbox-escalation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Bind Cloudflare native compute in Managed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('services/managed')
          index = root / 'src/index.ts'
          text = index.read_text()
          export_line = 'export { Sandbox } from "@cloudflare/sandbox";'
          if export_line not in text:
              anchor = 'export { WorkspaceServiceProxy };'
              if anchor not in text:
                  raise SystemExit('WorkspaceServiceProxy export anchor missing')
              text = text.replace(anchor, anchor + '\n' + export_line, 1)
              index.write_text(text)

          wrangler = root / 'wrangler.jsonc'
          data = json.loads(wrangler.read_text())
          containers = data.setdefault('containers', [])
          if not any(item.get('class_name') == 'Sandbox' for item in containers):
              containers.append({
                  'class_name': 'Sandbox',
                  'image': './Dockerfile',
                  'instance_type': 'lite',
              })
          bindings = data['durable_objects']['bindings']
          if not any(item.get('name') == 'NANOCODEX_COMPUTE_SANDBOX' for item in bindings):
              bindings.append({
                  'name': 'NANOCODEX_COMPUTE_SANDBOX',
                  'class_name': 'Sandbox',
              })
          migrations = data['migrations']
          if not any(item.get('tag') == 'v5' for item in migrations):
              migrations.append({
                  'tag': 'v5',
                  'new_sqlite_classes': ['Sandbox'],
              })
          wrangler.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Check Managed compute paths
        run: |
          npm ci --prefix services/managed --ignore-scripts
          npm --prefix services/managed run typecheck
          npx --prefix services/managed vitest run \
            services/managed/test/computer-provider-config.test.ts \
            services/managed/test/computer-provider-ix.test.ts \
            services/managed/test/computer-provider.test.ts \
            services/managed/test/computer-escalation.test.ts
          npm --prefix services/managed run build
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-managed-compute.yml
          git add services/managed/src/index.ts services/managed/wrangler.jsonc
          git commit -m "feat(managed): bind Cloudflare native compute"
          git push
