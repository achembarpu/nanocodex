name: Inspect ix SDK exports

on:
  push:
    branches: [feat/managed-sandbox-escalation]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install --prefix services/managed/ix-smoke --ignore-scripts
      - name: Show machine surface
        run: |
          grep -n -E 'class Machine|interface Machine|machines\(|connect\(|get id|readonly id| id:' services/managed/ix-smoke/node_modules/@indexable/sdk/generated/index.d.ts | head -120
