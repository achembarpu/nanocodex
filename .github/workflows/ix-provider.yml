name: ix provider

on:
  pull_request:
    paths:
      - ".github/workflows/ix-provider.yml"
      - "services/managed/ix-broker/**"
      - "services/managed/src/computer-provider-ix.ts"
      - "services/managed/test/computer-provider-ix.test.ts"
  push:
    branches: [master]
    paths:
      - ".github/workflows/ix-provider.yml"
      - "services/managed/ix-broker/**"
      - "services/managed/src/computer-provider-ix.ts"
      - "services/managed/test/computer-provider-ix.test.ts"

permissions:
  contents: read

jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install --prefix services/managed/ix-broker --ignore-scripts
      - run: npm test --prefix services/managed/ix-broker
