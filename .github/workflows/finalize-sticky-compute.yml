name: Finalize sticky compute promotion

permissions:
  contents: write

on:
  push:
    branches: [feat/managed-sandbox-escalation]

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@3522286d40783523f9c7880e33f785905b4c20d0 # v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Finalize sticky promotion policy
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("services/managed/src/computer-runtime.ts")
          text = runtime.read_text()

          text = text.replace(
              'const COMMAND_SEPARATORS = new Set([";", "&&", "||", "|", "&"]);',
              'const COMMAND_SEPARATORS = new Set([";", "&&", "||", "|"]);',
              1,
          )

          meta = '''const META_COMMANDS = new Set([
            ".",
            "bash",
            "builtin",
            "command",
            "env",
            "eval",
            "exec",
            "sh",
            "source",
            "xargs",
          ]);
          '''
          policy_sets = meta + '''const READ_ONLY_RETRY_COMMANDS = new Set([
            "[",
            "basename",
            "cat",
            "cmp",
            "cut",
            "diff",
            "dirname",
            "echo",
            "false",
            "file",
            "find",
            "grep",
            "head",
            "ls",
            "printenv",
            "printf",
            "pwd",
            "readlink",
            "realpath",
            "stat",
            "tail",
            "test",
            "tr",
            "true",
            "uniq",
            "wc",
          ]);
          const FIND_MUTATING_ACTIONS = new Set([
            "-delete",
            "-exec",
            "-execdir",
            "-fprint",
            "-fprint0",
            "-fprintf",
            "-ok",
            "-okdir",
          ]);
          '''
          if meta not in text:
              raise SystemExit("meta command anchor missing")
          text = text.replace(meta, policy_sets, 1)

          old_execute = '''    try {
              const result = await virtualTool.handler(input, context);
              if (!isVirtualLimitationResult(result)) return result;
              promoted = true;
              return executeNativeCommand(parsed, context, provider);
            } catch (error) {
              if (!isVirtualLimitationError(error)) throw error;
              promoted = true;
              return executeNativeCommand(parsed, context, provider);
            }
          '''
          new_execute = '''    const retrySafe = isVirtualRetrySafeCommand(parsed.cmd);
            try {
              const result = await virtualTool.handler(input, context);
              if (!isVirtualLimitationResult(result)) return result;
              promoted = true;
              return retrySafe
                ? executeNativeCommand(parsed, context, provider)
                : result;
            } catch (error) {
              if (!isVirtualLimitationError(error)) throw error;
              promoted = true;
              if (!retrySafe) throw error;
              return executeNativeCommand(parsed, context, provider);
            }
          '''
          if old_execute not in text:
              raise SystemExit("sticky execute anchor missing")
          text = text.replace(old_execute, new_execute, 1)

          start = text.index("export function isVirtualSafeCommand(")
          end = text.index("\nfunction lexShell(", start)
          replacement = '''export function isVirtualSafeCommand(command: string, safeCommands: ReadonlySet<string>): boolean {
            const tokens = lexShell(command);
            if (!tokens) return false;
            let expectingCommand = true;
            let skipRedirectionTarget = false;
            let currentCommand: string | undefined;
            let currentArguments: string[] = [];
            const finishInvocation = () => currentCommand === undefined
              || isManagedShimInvocationSafe(currentCommand, currentArguments);

            for (const token of tokens) {
              if (token.kind === "operator") {
                if (token.value === "(" || token.value === ")" || token.value === "<<" || token.value === "<<<") {
                  return false;
                }
                if (token.value === ">" || token.value === ">>" || token.value === "<") {
                  skipRedirectionTarget = true;
                  continue;
                }
                if (COMMAND_SEPARATORS.has(token.value)) {
                  if (!finishInvocation()) return false;
                  expectingCommand = true;
                  currentCommand = undefined;
                  currentArguments = [];
                  continue;
                }
                return false;
              }

              if (skipRedirectionTarget) {
                skipRedirectionTarget = false;
                continue;
              }
              if (expectingCommand) {
                if (isAssignment(token.value)) continue;
                if (token.value.includes("$") || token.value.includes("*")) return false;
                if (META_COMMANDS.has(token.value) || !safeCommands.has(token.value)) return false;
                currentCommand = token.value;
                currentArguments = [];
                expectingCommand = false;
                continue;
              }
              if (currentCommand === "find" && (token.value === "-exec" || token.value === "-execdir")) {
                return false;
              }
              currentArguments.push(token.value);
            }
            return !skipRedirectionTarget && finishInvocation();
          }

          function isManagedShimInvocationSafe(command: string, args: readonly string[]): boolean {
            if (command === "git") {
              switch (args[0]) {
                case "clone":
                  return args.length >= 2;
                case "status":
                  return args.slice(1).every((arg) => ["--short", "-s", "--porcelain"].includes(arg));
                case "log":
                  return args.slice(1).every((arg, index, values) =>
                    arg === "--oneline"
                    || /^-\\d+$/u.test(arg)
                    || arg === "-n" && /^\\d+$/u.test(values[index + 1] ?? "")
                    || index > 0 && values[index - 1] === "-n" && /^\\d+$/u.test(arg)
                    || arg === "--max-count"
                    || index > 0 && values[index - 1] === "--max-count" && /^\\d+$/u.test(arg)
                    || /^--max-count=\\d+$/u.test(arg));
                case "rev-parse":
                  return args.length === 2 && args[1] === "HEAD";
                case "branch":
                  return args.length === 1 || args.length === 2 && args[1] === "--show-current";
                case "remote":
                  return args.length === 1 || args.length === 2 && args[1] === "-v";
                case "ls-files":
                  return args.length === 1;
                default:
                  return false;
              }
            }
            if (command === "gh") {
              if (args[0] === "auth") return args.length === 2 && args[1] === "status";
              if (args[0] === "api") return args.length >= 2;
              if (args[0] === "repo") {
                return args[1] === "view" || args[1] === "clone" || args[1] === "list";
              }
              return args[0] === "pr" && args[1] === "list";
            }
            return true;
          }

          /**
           * Post-execution retry is allowed only when the full expression is
           * read-only. This lets emulator-only failures disappear from the model
           * without ever replaying a command that may already have mutated state.
           */
          export function isVirtualRetrySafeCommand(command: string): boolean {
            const tokens = lexShell(command);
            if (!tokens) return false;
            let expectingCommand = true;
            let skipRedirectionTarget = false;
            let currentCommand: string | undefined;

            for (const token of tokens) {
              if (token.kind === "operator") {
                if (token.value === ">" || token.value === ">>") return false;
                if (token.value === "<") {
                  skipRedirectionTarget = true;
                  continue;
                }
                if (COMMAND_SEPARATORS.has(token.value)) {
                  expectingCommand = true;
                  currentCommand = undefined;
                  continue;
                }
                return false;
              }

              if (skipRedirectionTarget) {
                skipRedirectionTarget = false;
                continue;
              }
              if (expectingCommand) {
                if (isAssignment(token.value)) continue;
                if (!READ_ONLY_RETRY_COMMANDS.has(token.value)) return false;
                currentCommand = token.value;
                expectingCommand = false;
                continue;
              }
              if (currentCommand === "find" && FIND_MUTATING_ACTIONS.has(token.value)) return false;
            }
            return !skipRedirectionTarget;
          }
          '''
          text = text[:start] + replacement + text[end:]
          runtime.write_text(text)

          escalation = Path("services/managed/test/computer-escalation.test.ts")
          test_text = escalation.read_text()
          test_text = test_text.replace(
              '''  createManagedComputerRuntime,
            isVirtualSafeCommand,
          ''',
              '''  createManagedComputerRuntime,
            isVirtualRetrySafeCommand,
            isVirtualSafeCommand,
          ''',
              1,
          )
          anchor = '''    expect(isVirtualSafeCommand("./script.sh", safe)).toBe(false);
            });
          '''
          replacement = '''    expect(isVirtualSafeCommand("./script.sh", safe)).toBe(false);
              const shims = new Set([...safe, "git", "gh"]);
              expect(isVirtualSafeCommand("git status --short", shims)).toBe(true);
              expect(isVirtualSafeCommand("git checkout main", shims)).toBe(false);
              expect(isVirtualSafeCommand("gh api /user", shims)).toBe(true);
              expect(isVirtualSafeCommand("gh issue list", shims)).toBe(false);

              expect(isVirtualRetrySafeCommand("cat marker | grep cheap")).toBe(true);
              expect(isVirtualRetrySafeCommand("find . -type f")).toBe(true);
              expect(isVirtualRetrySafeCommand("cat marker > copy")).toBe(false);
              expect(isVirtualRetrySafeCommand("printf cheap > marker")).toBe(false);
              expect(isVirtualRetrySafeCommand("find . -delete")).toBe(false);
              expect(isVirtualRetrySafeCommand("rm -rf generated")).toBe(false);
            });
          '''
          if anchor not in test_text:
              raise SystemExit("escalation test anchor missing")
          escalation.write_text(test_text.replace(anchor, replacement, 1))

          provider_test = Path("services/managed/test/computer-provider.test.ts")
          provider_text = provider_test.read_text()
          old = '''    expect(commands.some((command) => command.includes("base64 -d >> '/workspace/Cargo.toml'")))
                .toBe(true);
          '''
          new = '''    expect(commands.some((command) =>
                command.includes("base64 -d") && command.includes("Cargo.toml")))
                .toBe(true);
          '''
          if old not in provider_text:
              raise SystemExit("exe projection assertion anchor missing")
          provider_test.write_text(provider_text.replace(old, new, 1))

          Path(".github/workflows/finalize-sticky-compute.yml").unlink()
          PY
      - name: Build JS bindings
        run: |
          npm ci --prefix js/bindings
          ./scripts/build-js-package.sh
      - name: Install Managed dependencies
        run: npm ci --prefix services/managed
      - name: Typecheck Managed
        run: npm run typecheck --prefix services/managed
      - name: Prepare Managed evaluator
        run: npm run prepare:code-evaluator --prefix services/managed
      - name: Test compute promotion
        run: >-
          npm run test:worker --prefix services/managed --
          test/computer-escalation.test.ts
          test/computer-provider.test.ts
          test/computer-provider-config.test.ts
          test/computer-provider-ix.test.ts
          test/computer-runtime.test.ts
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/managed/src/computer-runtime.ts services/managed/test/computer-escalation.test.ts services/managed/test/computer-provider.test.ts .github/workflows/finalize-sticky-compute.yml
          git commit -m "fix(managed): harden sticky compute promotion"
          git push
