[package]
name = "nanocodex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Alloy-style facade for the Nanocodex agents SDK"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = []
observability = ["dep:nanocodex-observability"]
realtime = ["nanocodex-oai-api/realtime"]

[dependencies]
nanocodex-agent.workspace = true
nanocodex-durability.workspace = true
nanocodex-oai-api.workspace = true
nanocodex-tools.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocodex-observability = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
