<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("nanocodex-theme");
          const theme = stored === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#161616" : "#ffffff");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta
      name="description"
      content="A complete OpenAI coding agent embedded in your product, with typed SDKs for Rust, JavaScript, browser applications, and Python."
    />
    <meta
      property="og:title"
      content="Nanocodex — a complete OpenAI coding agent, embedded in your product"
    />
    <meta
      property="og:description"
      content="Embed the complete coding loop: persistent Responses sessions, tools, Code Mode, MCP, branches, subagents, browser workspaces, and evidence-backed evals."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nanocodex — a complete OpenAI coding agent, embedded in your product"
    />
    <meta
      name="twitter:description"
      content="The complete OpenAI coding loop for Rust, JavaScript, browser applications, and Python."
    />
    <meta name="twitter:image" content="/og.png" />
    <title>Nanocodex — a complete OpenAI coding agent, embedded in your product</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
