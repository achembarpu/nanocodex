<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("nanocodex-theme");
          const theme = stored === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#161616" : "#ffffff");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta
      name="description"
      content="The coding agent is the library. Embed one owned OpenAI Responses lifecycle through Rust, JavaScript, browser applications, or Python."
    />
    <meta
      property="og:title"
      content="Nanocodex — the coding agent is the library"
    />
    <meta
      property="og:description"
      content="Own the interface; embed the complete loop: retained sessions, tools, Code Mode, branches, subagents, browser workspaces, and evidence-backed evals."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nanocodex — the coding agent is the library"
    />
    <meta
      name="twitter:description"
      content="One owned OpenAI Responses agent for Rust, JavaScript, browser applications, and Python. Bring your own product interface."
    />
    <meta name="twitter:image" content="/og.png" />
    <title>Nanocodex — the coding agent is the library</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
