# Frontier-Bench run using the same pinned Nanocodex Turbo binary as the
# Terminal-Bench 2.1 Ultra-style run. Override `effort` at launch to sweep
# medium, high, xhigh, and max without changing any benchmark task prompt.
jobs_dir: .nanocodex/harbor/jobs
n_attempts: 5
timeout_multiplier: 5.0
agent_timeout_multiplier: 5.0
verifier_timeout_multiplier: 5.0
agent_setup_timeout_multiplier: 5.0
environment_build_timeout_multiplier: 5.0

agents:
  - import_path: harbor_adapter.agent:NanocodexAgent
    model_name: openai/gpt-5.6-sol
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    kwargs:
      effort: medium
      web_search: false
      turbo: true
      install_node: true

datasets:
  - name: frontier-bench/frontier-bench
    ref: sha256:63f363a191f0a0429fd1c5b318080616bab839473ce27e39f44868d327b03a89
